    summary: "Jarrad Hope (Logos/Status), with Sterlin Lujan, on Farewell to Westphalia: pirating institutions, the cost of exit, and why success means the technology is never needed."
    digest: "Jarrad Hope, co-author of Farewell to Westphalia, traces cyber-state lineage from LambdaMOO's self-governance through cypherpunk islands in the net to blockchains as parliamentary sovereignty. He steelmans the nation state: the tech is a hedge, and success is that it's not needed [09:58]. The punchline: instead of pirating music, we'll be pirating institutions, deployed where people are underserved [22:39]. Against the CEO-led network state he sets Satoshi, the king made of stone, and forking as ultimate exit — not worried about centralization, worried about the cost of exit [53:30]."
