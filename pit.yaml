    transcript_format: "pit-transcript/1 · plain text, [MM:SS] timestamps"
    summary: "Two sessions: Amir Taaki and the DarkFi crew on lunarpunk and deniable anonymous infrastructure — then Blockful's Zug on the $500M drained from DAOs through governance, not code."
    digest: "Amir Taaki argues crypto forgot its mission: billions of dollars and decades later, people still have not built an anonymous chat app — everybody's using Google Docs, it's embarrassing [11:57]. DarkFi's answer is fully p2p, deniable infrastructure — anonymous DAOs, swaps, chat — built by a largely anonymous dev community; panelist Rose frames lunarpunk as freedom toward something, not just from. Then Zug of Blockful: some $500M stolen from DAOs via governance, with code working exactly as audited [01:02:56] — anticapture.com rates DAO security on the assumption that Lazarus already knows."
