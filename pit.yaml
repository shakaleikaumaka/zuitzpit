    summary: "Vitalik, Glen Weyl, Tomasz Stańczak, and Puja Ohlhaver open the d/acc track, then go deep: plural publics and privacy, pro-social media, biosecurity, and the money–voice trade-off."
    digest: "The d/acc track opens with a panel — Vitalik Buterin, Glen Weyl, Tomasz Stańczak, Puja Ohlhaver — on solarpunk, lunarpunk, and privacy as a public good: the things you can no longer do because others are watching [20:28]. Then three talks: Weyl on bridging-based social media that rewards consensus over division [39:28]; Aleš Flídr on differential technology development and far-UVC pandemic defense [01:03:31]; Ohlhaver on PCARE, where locked currency becomes non-transferable voice [01:46:18]. Vitalik's charge: move d/acc from the philosophizing phase to active building."
