    summary: "Balaji's network-state thesis for the Zuitzerland room: China is strong, but the Internet is stronger — and startup societies are how the Internet takes the torch from America."
    digest: "Balaji argues China has overtaken the US in hard power, but no amount of violence can solve certain kinds of math problems — BTC versus the CCP [05:55]. His litany: the Internet is mail, media, money, contracts, democracy — it lets you choose the denominator, creating the polity itself [12:48]. Network states are the succession: just as America took the torch from Britain, the Internet takes it from America [17:14]. Q&A spans Network School, the laptop test for high-trust communities, crypto-first Swiss neutrality, and the subscription state."
